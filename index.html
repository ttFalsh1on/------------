<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language school</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header"><h1>Языковая школа</h1></header>
    <main>
        <form class="about">
            <h2>О нас</h2>
            <h3>Мы школа специализирующая себя на инностранных языках</h3>
            <h4>Языки - Английский, Французкий, Немецкий, Португальский, Испанский</h4>
            <h4>Отличные преподователи со стажем 7 лет минимум</h4>
        </form>
        <form class="cost">
            <h2>Цены, занятия</h2>
            <p>1000р - 1 занятие</p>
            <p>4 занятия в месяц</p>
            <p>Поддержка вне занятия</p>
        </form>
        <form class="move">
            <h2>Подать заявку</h2>
            <select class="kind_of_lessons">
                <option>Английский</option>
                <option>Франзузкий</option>
                <option>Немецкий</option>
                <option>Португальский</option>
                <option>Испанский</option>
            </select>
            <label for="online">
                <input type="radio" name="online"> Онлайн
            </label>
            <label for="offline">
                <input type="radio" name="offline"> Очно
            </label>
            <label for="mixed">
                <input type="radio" name="mixed"> Смешанно
            </label>
            <label for="name">Имя<input id="name" name="name" type="text"></label>
            <label for="sname">Фамилия<input id="sname" name="sname" type="text"></label>
            <label for="explaining">После введения данных вы отправяетесь к нам по нажатию этой ссылки</label>
            <button class="button" type="submit">Нажмите</button>
        </form>
    </main>
</body>
</html>
